version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: osint_user
      POSTGRES_PASSWORD: osint_password
      POSTGRES_DB: osint_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://osint_user:osint_password@postgres:5432/osint_db
      JWT_ACCESS_SECRET: your-access-secret-key-change-this
      JWT_REFRESH_SECRET: your-refresh-secret-key-change-this
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
